name: bulwark-plugins-test

# Backend services for plugin end-to-end tests. See README.md.
#
# Host ports are picked to stay clear of the webmail integration stack
# (8025/1025/1143) and other local containers.

services:
  stalwart:
    build:
      context: stalwart
    container_name: bpt-stalwart
    ports:
      - "18025:8080"
      - "11587:587"
    volumes:
      - stalwart-data:/var/lib/stalwart
      - stalwart-config:/etc/stalwart
    environment:
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:-admin:bootstrap-secret}
      TEST_ACCOUNT_PASSWORD: ${TEST_ACCOUNT_PASSWORD:-test-pass-123}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u alice@example.org:$${TEST_ACCOUNT_PASSWORD} http://127.0.0.1:8080/jmap/session >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  nextcloud:
    image: nextcloud:34.0.4-apache
    container_name: bpt-nextcloud
    ports:
      - "18080:80"
    volumes:
      - nextcloud-html:/var/www/html
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin-pass-123}
      # localhost for the browser and the webmail on the host, the container
      # names for other containers on the compose network.
      NEXTCLOUD_TRUSTED_DOMAINS: localhost localhost:18080 127.0.0.1 127.0.0.1:18080 bpt-nextcloud nextcloud
      OVERWRITECLIURL: http://localhost:18080
      PHP_UPLOAD_LIMIT: 1G
      PHP_MEMORY_LIMIT: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/status.php | grep -q '\"installed\":true'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  # Seafile keeps its records in MariaDB and its cache in Redis.
  seafile-db:
    image: mariadb:10.11
    container_name: bpt-seafile-db
    volumes:
      - seafile-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${SEAFILE_DB_ROOT_PASSWORD:-root-pass-123}
      MYSQL_LOG_CONSOLE: "true"
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--mariadbupgrade", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  seafile-redis:
    image: redis:8.2.10-alpine
    container_name: bpt-seafile-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  seafile:
    image: seafileltd/seafile-mc:14.0.9
    container_name: bpt-seafile
    depends_on:
      seafile-db:
        condition: service_healthy
      seafile-redis:
        condition: service_healthy
    ports:
      - "18090:80"
    volumes:
      - seafile-data:/shared
    environment:
      SEAFILE_MYSQL_DB_HOST: seafile-db
      SEAFILE_MYSQL_DB_PORT: "3306"
      SEAFILE_MYSQL_DB_USER: seafile
      SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_DB_PASSWORD:-seafile-pass-123}
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: ${SEAFILE_DB_ROOT_PASSWORD:-root-pass-123}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      INIT_SEAFILE_ADMIN_EMAIL: admin@example.org
      INIT_SEAFILE_ADMIN_PASSWORD: ${SEAFILE_ADMIN_PASSWORD:-admin-pass-123}
      # Seafile builds every link it hands out (sign-in, downloads, uploads,
      # shares) from this address, so it is the one the browser and the
      # webmail use. For a webmail in a container on this network, set
      # SEAFILE_HOSTNAME=bpt-seafile before the first start; the browser that
      # signs in then has to be on this network too (see README.md).
      SEAFILE_SERVER_HOSTNAME: ${SEAFILE_HOSTNAME:-localhost:18090}
      SEAFILE_SERVER_PROTOCOL: http
      # The first-run setup only takes a name without a port; this is what
      # it reads instead of SEAFILE_SERVER_HOSTNAME.
      SERVER_IP: 127.0.0.1
      JWT_PRIVATE_KEY: bulwark-plugin-test-only-not-secret-0123456789
      TIME_ZONE: Europe/Berlin
      SITE_ROOT: /
      NON_ROOT: "false"
      SEAFILE_LOG_TO_STDOUT: "true"
      ENABLE_GO_FILESERVER: "true"
      ENABLE_SEAFDAV: "false"
      ENABLE_SEADOC: "false"
      ENABLE_NOTIFICATION_SERVER: "false"
      ENABLE_SEAFILE_AI: "false"
      ENABLE_METADATA_MANAGEMENT: "False"
      CACHE_PROVIDER: redis
      REDIS_HOST: seafile-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api2/ping/ | grep -q pong"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  paperless-redis:
    image: redis:8.2.10-alpine
    container_name: bpt-paperless-redis
    volumes:
      - paperless-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1
    container_name: bpt-paperless
    depends_on:
      paperless-redis:
        condition: service_healthy
    ports:
      - "18010:8000"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
    environment:
      # No PAPERLESS_DBHOST, so Paperless uses SQLite in the data volume.
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_URL: http://localhost:18010
      PAPERLESS_ALLOWED_HOSTS: localhost,127.0.0.1,bpt-paperless,paperless
      PAPERLESS_CSRF_TRUSTED_ORIGINS: http://localhost:18010,http://127.0.0.1:18010
      PAPERLESS_SECRET_KEY: bulwark-plugin-test-only-not-secret
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-admin-pass-123}
      PAPERLESS_ADMIN_MAIL: admin@example.org
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: eng
      # The seeded PDFs have a text layer; skip OCR so consumption is quick.
      PAPERLESS_OCR_MODE: skip
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "-o", "/dev/null", "http://127.0.0.1:8000/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  vikunja:
    image: vikunja/vikunja:2.6.0
    container_name: bpt-vikunja
    # Named volumes are created root-owned and the image runs as uid 1000,
    # which then cannot write the files directory. Root is fine for a test box.
    user: "0:0"
    ports:
      - "18456:3456"
    volumes:
      - vikunja-db:/db
      - vikunja-files:/app/vikunja/files
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://localhost:18456/
      VIKUNJA_SERVICE_SECRET: bulwark-plugin-test-only-not-secret
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
      VIKUNJA_SERVICE_TIMEZONE: Europe/Berlin
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
    # The image has no shell or curl, so there is no container healthcheck;
    # seed/seed_vikunja.py waits for /api/v1/info instead.

  donetick:
    image: donetick/donetick:v0.1.85
    container_name: bpt-donetick
    ports:
      - "18021:2021"
    volumes:
      - donetick-data:/donetick-data
    environment:
      DT_ENV: selfhosted
      DT_SQLITE_PATH: /donetick-data/donetick.db
      DT_JWT_SECRET: bulwark-plugin-test-only-not-secret-0123456789
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:2021/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mocks:
    image: python:3.13.16-alpine
    container_name: bpt-mocks
    command: ["python", "-u", "/mocks/server.py", "--port", "18099"]
    ports:
      - "18099:18099"
    volumes:
      - ./mocks:/mocks:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18099/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional: `docker compose --profile ai up -d` (or up.ps1 -WithAI /
  # up.sh --with-ai). The model is pulled by seed/seed_ollama.py.
  ollama:
    image: ollama/ollama:0.40.3
    container_name: bpt-ollama
    profiles: ["ai"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  stalwart-data:
  stalwart-config:
  nextcloud-html:
  seafile-db:
  seafile-data:
  paperless-redis:
  paperless-data:
  paperless-media:
  vikunja-db:
  vikunja-files:
  donetick-data:
  ollama-models:
